<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Diklat · Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a14;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #8b5cf6;
    --accent-2: #06b6d4;
    --ok: #10b981;
    --glow: 0 0 40px rgba(139,92,246,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    animation: float 18s ease-in-out infinite;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #8b5cf6, transparent 70%);
    top: -180px; left: -120px;
  }
  body::after {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #06b6d4, transparent 70%);
    bottom: -220px; right: -160px;
    animation-delay: -9s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, -40px) scale(1.15); }
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    display: grid; place-items: center;
    font-size: 24px;
    box-shadow: var(--glow);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, #fff 30%, #8b5cf6 70%, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .sub {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
    font-weight: 500;
  }

  .card {
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px 22px;
    margin-bottom: 16px;
    transition: border-color .3s;
    animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .card:hover { border-color: var(--border-2); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card-num {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    display: grid; place-items: center;
    font-size: 0.72rem;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }
  .card-head h2 {
    font-size: 0.72rem;
    margin: 0;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .card-head .head-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .reset-btn, .eye-btn {
    height: 38px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
    padding: 0;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .reset-btn:hover, .eye-btn:hover {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border-2);
    transform: translateY(-1px);
  }
  .reset-btn { padding: 0 12px; letter-spacing: 0.03em; }
  .eye-btn { width: 38px; }
  .eye-btn.on {
    background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(6,182,212,0.15));
    color: #fff;
    border-color: rgba(139,92,246,0.4);
    box-shadow: 0 4px 16px rgba(139,92,246,0.2);
  }
  .eye-btn svg { width: 17px; height: 17px; }
  .eye-btn .eye-open { display: block; }
  .eye-btn .eye-closed { display: none; }
  .eye-btn.on .eye-open { display: none; }
  .eye-btn.on .eye-closed { display: block; }

  .date-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .date-box { flex: 1; min-width: 220px; position: relative; }
  input[type=date] {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,0.25);
    transition: all .2s;
    color-scheme: dark;
  }
  input[type=date]:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(139,92,246,0.08);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
  }
  input[type=date]::-webkit-calendar-picker-indicator {
    filter: invert(0.75);
    cursor: pointer;
    padding: 4px;
    margin-left: 6px;
  }
  .day-badge {
    padding: 12px 20px;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(6,182,212,0.18));
    border: 1px solid rgba(139,92,246,0.4);
    font-weight: 800;
    font-size: 0.95rem;
    color: #fff;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(139,92,246,0.2);
    min-width: 130px;
    justify-content: center;
  }

  .info-note {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(139,92,246,0.08);
    border: 1px dashed rgba(139,92,246,0.3);
    border-radius: 11px;
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .info-note b { color: #c4b5fd; }

  /* ====== Collapsible ====== */
  .collapse-wrap {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .4s cubic-bezier(.2,.8,.2,1), margin-top .3s;
    margin-top: 16px;
  }
  .collapse-wrap.collapsed {
    grid-template-rows: 0fr;
    margin-top: 0;
  }
  .collapse-inner {
    overflow: hidden;
    min-height: 0;
  }

  /* ====== Jadwal Lengkap ====== */
  .full-scroll {
    overflow-x: auto;
    margin: 0 -6px;
    padding: 0 6px;
  }
  .full-scroll::-webkit-scrollbar { height: 8px; }
  .full-scroll::-webkit-scrollbar-thumb {
    background: var(--border-2);
    border-radius: 4px;
  }

  .schedule-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 4px;
    font-size: 0.72rem;
    min-width: 900px;
  }
  .schedule-table th {
    padding: 8px 10px;
    text-align: center;
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
    background: transparent;
  }
  .schedule-table th.col-kelas,
  .schedule-table th.col-waktu { text-align: left; }
  .schedule-table th.aktif {
    background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(6,182,212,0.2));
    color: #fff;
    border-radius: 10px;
    border: 1px solid rgba(139,92,246,0.4);
    box-shadow: 0 4px 16px rgba(139,92,246,0.2);
  }

  .schedule-table td {
    padding: 8px 10px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: 10px;
    vertical-align: middle;
    text-align: center;
  }
  .schedule-table td.col-kelas {
    font-weight: 800;
    font-size: 0.72rem;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .schedule-table td.col-kelas[data-kelas="regoff"] { color: #a78bfa; }
  .schedule-table td.col-kelas[data-kelas="regon"]  { color: #38bdf8; }
  .schedule-table td.col-kelas[data-kelas="dsmb"]   { color: #34d399; }
  .schedule-table td.col-kelas[data-kelas="mahasantri"] { color: #fbbf24; }

  .schedule-table td.col-waktu {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent-2);
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
  }
  .schedule-table td.cell-day { }
  .schedule-table td.cell-day.aktif {
    background: rgba(139,92,246,0.08);
    border-color: rgba(139,92,246,0.22);
  }
  .schedule-table .sc-mapel {
    font-weight: 700;
    font-size: 0.68rem;
    color: var(--text);
    line-height: 1.3;
  }
  .schedule-table .sc-tutor {
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.3;
  }
  .schedule-table .sc-empty {
    color: var(--dim);
    font-size: 0.68rem;
  }

  /* ====== Section Program ====== */
  .prog-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .prog-header .prog-num {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    display: grid; place-items: center;
    font-size: 0.78rem;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }
  .prog-title {
    font-size: 1.05rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
    background: linear-gradient(120deg, #fff 40%, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .prog-sub {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 600;
    margin-top: 1px;
  }
  .prog-header .head-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .jadwal-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .jadwal-item {
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    transition: border-color .2s;
  }
  .jadwal-item:hover { border-color: var(--border-2); }

  .jadwal-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 0.78rem;
  }
  .jadwal-time {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-2);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .jadwal-loc {
    color: var(--muted);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .jadwal-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    padding: 8px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all .18s;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .pill:hover { transform: translateY(-1px); }
  .pill .edit-ico {
    font-size: 0.68rem;
    opacity: 0.45;
    transition: opacity .18s;
  }
  .pill:hover .edit-ico { opacity: 1; }

  .pill-mapel {
    background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(6,182,212,0.12));
    border-color: rgba(139,92,246,0.35);
  }
  .pill-mapel:hover {
    background: linear-gradient(135deg, rgba(139,92,246,0.32), rgba(6,182,212,0.22));
    border-color: rgba(139,92,246,0.6);
  }

  .pill-tutor {
    background: linear-gradient(135deg, rgba(16,185,129,0.16), rgba(6,182,212,0.12));
    border-color: rgba(16,185,129,0.32);
  }
  .pill-tutor:hover {
    background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(6,182,212,0.22));
    border-color: rgba(16,185,129,0.55);
  }

  .pill-empty {
    color: var(--muted);
    border-style: dashed;
    border-color: rgba(148,163,184,0.3);
  }
  .pill-empty:hover {
    color: var(--text);
    border-color: rgba(139,92,246,0.5);
  }

  .no-jadwal {
    padding: 22px 16px;
    text-align: center;
    color: var(--dim);
    font-size: 0.82rem;
    font-weight: 600;
    background: rgba(0,0,0,0.15);
    border: 1px dashed var(--border-2);
    border-radius: 12px;
  }

  /* ====== Hasil ====== */
  .hasil-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .hasil-label {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .hasil-textarea {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    line-height: 1.7;
    min-height: 260px;
    background: #06060d;
    color: #cbd5e1;
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 14px;
    letter-spacing: 0.01em;
    width: 100%;
    resize: vertical;
  }
  .hasil-textarea:focus { outline: none; }

  .copy-btn, .wa-btn {
    padding: 9px 16px;
    border: none;
    border-radius: 11px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all .2s;
    flex-shrink: 0;
  }
  .copy-btn {
    margin-left: auto;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    box-shadow: 0 6px 20px rgba(139,92,246,0.35);
  }
  .copy-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(139,92,246,0.45);
  }
  .copy-btn:active { transform: translateY(0); }
  .copy-btn.ok {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 6px 20px rgba(16,185,129,0.4);
  }

  .wa-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 6px 20px rgba(34,197,94,0.3);
  }
  .wa-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(34,197,94,0.45);
  }
  .wa-btn:active { transform: translateY(0); }

  /* ====== Modal ====== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,4,12,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: #10101d;
    border: 1px solid var(--border-2);
    border-radius: 22px;
    padding: 22px;
    max-width: 440px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    transform: scale(.94) translateY(8px);
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.1);
  }
  .modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
  .modal-head {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .modal-head h3 {
    font-size: 0.95rem;
    margin: 0;
    font-weight: 800;
    background: linear-gradient(120deg, #fff, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .modal-head .kelas-tag {
    margin-left: 4px;
    font-size: 0.66rem;
    padding: 3px 9px;
    border-radius: 6px;
    background: rgba(139,92,246,0.18);
    border: 1px solid rgba(139,92,246,0.35);
    color: #c4b5fd;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .modal-close {
    margin-left: auto;
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 0.8rem;
    transition: all .2s;
    padding: 0;
  }
  .modal-close:hover { background: var(--surface-2); color: var(--text); }
  .modal-sub {
    font-size: 0.7rem;
    color: var(--dim);
    margin: 0 0 14px;
    font-weight: 500;
  }

  .tutor-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    padding-right: 4px;
    margin-bottom: 4px;
    max-height: 46vh;
  }
  .tutor-list::-webkit-scrollbar { width: 6px; }
  .tutor-list::-webkit-scrollbar-thumb {
    background: var(--border-2);
    border-radius: 3px;
  }
  .tutor-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all .18s;
    width: 100%;
  }
  .tutor-item:hover {
    background: rgba(139,92,246,0.12);
    border-color: rgba(139,92,246,0.35);
    transform: translateX(3px);
  }
  .tutor-item .tutor-icon { font-size: 1.05rem; line-height: 1; flex-shrink: 0; }
  .tutor-item .tutor-name { flex: 1; }
  .tutor-item .tutor-sub {
    font-size: 0.68rem;
    color: var(--dim);
    font-weight: 500;
  }
  .tutor-item.selected {
    background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(6,182,212,0.18));
    border-color: rgba(139,92,246,0.5);
    box-shadow: 0 4px 14px rgba(139,92,246,0.2);
  }
  .tutor-item.selected::after {
    content: '✓';
    color: #a78bfa;
    font-weight: 800;
    font-size: 0.9rem;
  }

  /* Custom tutor input */
  .custom-tutor-wrap {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .custom-tutor-wrap input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,0.25);
  }
  .custom-tutor-wrap input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(139,92,246,0.08);
  }
  .custom-tutor-wrap button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    color: #fff;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
  }
  .custom-tutor-wrap button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(139,92,246,0.35);
  }

  @media (max-width: 600px) {
    body { padding: 16px 12px 40px; }
    header h1 { font-size: 1.2rem; }
    .logo { width: 44px; height: 44px; font-size: 20px; border-radius: 13px; }
    .card { padding: 16px 16px; border-radius: 18px; }
    .hasil-textarea { min-height: 220px; }
    .reset-btn .txt { display: none; }
    .reset-btn { padding: 0 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">📅</div>
    <div>
      <h1>Generator Jadwal Diklat</h1>
      <div class="sub">Pilih tanggal · tiap program punya template sendiri</div>
    </div>
  </header>

  <!-- ===== 1. PILIH TANGGAL ===== -->
  <section class="card">
    <div class="card-head">
      <div class="card-num">1</div>
      <h2>Pilih Tanggal</h2>
      <div class="head-actions">
        <button class="reset-btn" id="reset-all-btn" title="Reset semua ke jadwal default Excel">
          <span>↺</span><span class="txt">Reset Semua</span>
        </button>
      </div>
    </div>
    <div class="date-row">
      <div class="date-box">
        <input type="date" id="tanggal">
      </div>
      <div class="day-badge">
        <span>📅</span>
        <span id="day-label">Senin</span>
      </div>
    </div>
  </section>

  <!-- ===== 2. JADWAL LENGKAP ===== -->
  <section class="card" id="full-card">
    <div class="card-head">
      <div class="card-num">2</div>
      <h2>Jadwal Lengkap (Excel)</h2>
      <div class="head-actions">
        <button class="eye-btn" data-eye="full" title="Sembunyikan / Tampilkan">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="collapse-wrap collapsed" id="collapse-full">
      <div class="collapse-inner">
        <div class="full-scroll">
          <table class="schedule-table" id="schedule-table">
            <thead>
              <tr>
                <th class="col-kelas">Kelas</th>
                <th class="col-waktu">Waktu</th>
                <th data-head="Senin">Senin</th>
                <th data-head="Selasa">Selasa</th>
                <th data-head="Rabu">Rabu</th>
                <th data-head="Kamis">Kamis</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== PROGRAM SECTIONS ===== -->
  <div id="programs-container"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Pilih</h3>
      <span class="kelas-tag" id="modal-kelas-tag">—</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <p class="modal-sub" id="modal-sub">—</p>
    <div class="tutor-list" id="modal-list"></div>
    <div class="custom-tutor-wrap" id="custom-tutor-wrap" style="display:none">
      <input type="text" id="custom-tutor-input" placeholder="Ketik nama tutor baru..." autocomplete="off">
      <button id="custom-tutor-add">+ Tambah</button>
    </div>
  </div>
</div>

<script>
/* ================== KONSTANTA ================== */
const HARI = ["Senin", "Selasa", "Rabu", "Kamis"];
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const HARI_PANJANG = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

const WA_NUMBER = "6285717978659";

const PROGRAMS = [
  { key: "regoff",     name: "Reguler Offline", icon: "📚" },
  { key: "regon",      name: "Reguler Online",  icon: "💻" },
  { key: "dsmb",       name: "DSMB",            icon: "🎯" },
  { key: "mahasantri", name: "Mahasantri",      icon: "🕌" }
];

/* Tutor PER PROGRAM — tidak dicampur */
const TUTORS_BY_PROGRAM = {
  regoff:     ["MS. DHITA", "MS. LASMI", "MS. ROSNANI", "MS. ERN"],
  regon:      ["MS. DHITA", "MS. LASMI", "MS. ERN", "MR. ALAN"],
  dsmb:       ["MS. ERN", "MS. NANI", "MS. LASMI", "RENDI SENSEI"],
  mahasantri: ["MS. DHITA", "MS. ROSNANI", "USTAZAH IMPI", "MS. ERN"]
};

/* Default mapel → tutor (dari Excel) */
const TUTOR_BY_MAPEL = {
  regoff: {
    "VOCABULARY": "MS. DHITA",
    "EXPRESSION": "MS. LASMI",
    "GRAMMAR": "MS. ROSNANI",
    "SPEAKING": "MS. ERN"
  },
  regon: {
    "VOCABULARY": "MS. DHITA",
    "CONVERSATION": "MR. ALAN",
    "SPEAKING": "MS. ERN",
    "EXPRESSION": "MS. LASMI"
  },
  dsmb: {
    "SPEAKING": "MS. ERN",
    "GRAMMAR": "MS. NANI",
    "EXPRESSION & VOCABULARY": "MS. LASMI",
    "HIRGANA, KATAKANA, TANGGO": "RENDI SENSEI"
    /* MANAKIBAN dihapus */
  },
  mahasantri: {
    "EXPRESSIONS & VOCABULARY": "MS. DHITA",
    "GRAMMAR & INTERVIEW": "MS. ROSNANI",
    "KALAM & MUFRADHAT": "USTAZAH IMPI",
    "SPEAKING & CONVERSATION": "MS. ERN"
  }
};

/* Data jadwal default (Manakiban dihapus, Jumat tidak ada) */
const DATA = [
  { prog: "regoff", lokasi: "RPS", waktu: "09.00-10.30",
    hari: { Senin: "VOCABULARY", Selasa: "EXPRESSION", Rabu: "GRAMMAR", Kamis: "SPEAKING" } },

  { prog: "regon", lokasi: "Online", waktu: "16.00-17.31",
    hari: { Senin: "VOCABULARY", Selasa: "VOCABULARY", Rabu: "SPEAKING", Kamis: "EXPRESSION" } },
  { prog: "regon", lokasi: "Online", waktu: "20.00-21.30",
    hari: { Senin: "CONVERSATION", Selasa: "CONVERSATION", Rabu: "SPEAKING", Kamis: "EXPRESSION" } },

  { prog: "dsmb", lokasi: "RPS", waktu: "16.00-17.30",
    hari: { Senin: "SPEAKING", Selasa: "GRAMMAR", Rabu: "HIRGANA, KATAKANA, TANGGO", Kamis: "GRAMMAR" } },
  { prog: "dsmb", lokasi: "RPS", waktu: "20.00-21.30",
    hari: { Senin: "EXPRESSION & VOCABULARY", Selasa: "HIRGANA, KATAKANA, TANGGO", Rabu: "", Kamis: "HIRGANA, KATAKANA, TANGGO" } },

  { prog: "mahasantri", lokasi: "RPS", waktu: "16.00-17.00",
    hari: { Senin: "", Selasa: "", Rabu: "EXPRESSIONS & VOCABULARY", Kamis: "" } },
  { prog: "mahasantri", lokasi: "RPS", waktu: "20.00-21.00",
    hari: { Senin: "GRAMMAR & INTERVIEW", Selasa: "KALAM & MUFRADHAT", Rabu: "", Kamis: "SPEAKING & CONVERSATION" } }
];

const SAPAAN  = "Assalamu'alaikum warahmatullahi Wabarakatuh ";
const PENUTUP = "Sekian informasi yang dapat kami sampaikan, Wassalamu'alaikum warahmatullahi Wabarakatuh ☺️🙏🏻";

/* ================== SESSION STATE ================== */
/* { [progKey]: { [waktu]: { mapel?, tutor? } } } — berlaku untuk hari yang sedang dipilih */
let sessionOverrides = {};
/* Tutor custom per program (ketik manual) */
let customTutors = { regoff: [], regon: [], dsmb: [], mahasantri: [] };

/* ================== HELPER ================== */
function isKosong(v) {
  const t = (v || '').trim();
  return !t || t === '—' || t === '–' || t === '-';
}
function isFemale(name) {
  const n = (name || '').trim().toLowerCase();
  if (!n) return false;
  if (n.startsWith('mr') || n.startsWith('bapak') || n.startsWith('ustadz ')) return false;
  if (n.includes('alan') || n.includes('rendi')) return false;
  return true;
}
function icon(tutor) { return isFemale(tutor) ? '👩‍🏫' : '👨‍🏫'; }
function tanggalPanjang(val) {
  if (!val) return '';
  const d = new Date(val + 'T00:00:00');
  if (isNaN(d)) return '';
  return `${String(d.getDate()).padStart(2,'0')} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
}
function formatWaktu(w) { return (w || '').replace(/\s*-\s*/g, ' - ') + ' WIB'; }
function parseTime(w) {
  const m = (w || '').match(/(\d{1,2})[.:](\d{2})/);
  return m ? (+m[1]) * 60 + (+m[2]) : 0;
}
function getDayFromDate(val) {
  if (!val) return 'Senin';
  const d = new Date(val + 'T00:00:00');
  if (isNaN(d)) return 'Senin';
  return HARI_PANJANG[d.getDay()];
}
function isValidDay(day) { return HARI.includes(day); }
function getToday() { return getDayFromDate(document.getElementById('tanggal').value); }
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function getRow(progKey, waktu) {
  return DATA.find(r => r.prog === progKey && r.waktu === waktu);
}
function getTutorsForProgram(progKey) {
  const base = TUTORS_BY_PROGRAM[progKey] || [];
  const custom = customTutors[progKey] || [];
  const seen = new Set();
  const out = [];
  [...base, ...custom].forEach(t => {
    const k = t.toLowerCase();
    if (!seen.has(k)) { seen.add(k); out.push(t); }
  });
  return out;
}
function getMapelForProgram(progKey) {
  const set = new Set();
  DATA.filter(r => r.prog === progKey).forEach(r => {
    HARI.forEach(h => {
      const m = (r.hari[h] || '').trim();
      if (m) set.add(m);
    });
  });
  return [...set];
}

/* Effective value: hanya override diterapkan kalau `day` adalah hari yang sedang dipilih */
function getEffective(progKey, row, day) {
  const today = getToday();
  const isToday = (day === today);
  const ov = (isToday && sessionOverrides[progKey] && sessionOverrides[progKey][row.waktu]) || {};
  const defaultMapel = (row.hari[day] || '').trim();
  const mapel = ('mapel' in ov) ? ov.mapel : defaultMapel;
  let tutor;
  if ('tutor' in ov) {
    tutor = ov.tutor;
  } else {
    tutor = mapel ? ((TUTOR_BY_MAPEL[progKey] || {})[mapel] || '') : '';
  }
  return { mapel, tutor };
}

/* ================== RENDER JADWAL LENGKAP ================== */
function renderFullSchedule() {
  const tbody = document.querySelector('#schedule-table tbody');
  tbody.innerHTML = '';
  const today = getToday();

  DATA.forEach(r => {
    const prog = PROGRAMS.find(p => p.key === r.prog);
    const tr = document.createElement('tr');

    const tdK = document.createElement('td');
    tdK.className = 'col-kelas';
    tdK.dataset.kelas = r.prog;
    tdK.textContent = prog.name;
    tr.appendChild(tdK);

    const tdW = document.createElement('td');
    tdW.className = 'col-waktu';
    tdW.textContent = r.waktu;
    tr.appendChild(tdW);

    HARI.forEach(h => {
      const td = document.createElement('td');
      td.className = 'cell-day' + (h === today ? ' aktif' : '');
      const eff = getEffective(r.prog, r, h);
      if (isKosong(eff.mapel)) {
        td.innerHTML = `<span class="sc-empty">—</span>`;
      } else {
        td.innerHTML = `<div class="sc-mapel">${escHtml(eff.mapel)}</div>` +
                       (eff.tutor ? `<div class="sc-tutor">${icon(eff.tutor)} ${escHtml(eff.tutor)}</div>` : '');
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  /* Highlight header */
  document.querySelectorAll('#schedule-table th[data-head]').forEach(th => {
    th.classList.toggle('aktif', th.dataset.head === today);
  });
}

/* ================== BUILD UI PROGRAM ================== */
function buildProgramSections() {
  const container = document.getElementById('programs-container');
  container.innerHTML = '';

  PROGRAMS.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'card';
    sec.dataset.prog = p.key;
    sec.style.animationDelay = (0.05 * (i + 1)) + 's';

    sec.innerHTML = `
      <div class="prog-header">
        <div class="prog-num">${i + 3}</div>
        <div>
          <h3 class="prog-title">${p.icon} ${p.name}</h3>
          <div class="prog-sub" id="prog-sub-${p.key}">—</div>
        </div>
        <div class="head-actions">
          <button class="reset-btn" data-reset="${p.key}" title="Reset ke default Excel">
            <span>↺</span><span class="txt">Reset</span>
          </button>
          <button class="eye-btn" data-eye="${p.key}" title="Sembunyikan / Tampilkan">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="collapse-wrap collapsed" id="collapse-${p.key}">
        <div class="collapse-inner">
          <div class="jadwal-list" id="list-${p.key}"></div>
        </div>
      </div>

      <div class="hasil-head">
        <span class="hasil-label">Hasil · ${p.name}</span>
        <button class="copy-btn" data-copy="${p.key}">
          <span>📋</span><span>Salin</span>
        </button>
        <button class="wa-btn" data-wa="${p.key}">
          <span>💬</span><span>Kirim WA</span>
        </button>
      </div>
      <textarea id="hasil-${p.key}" class="hasil-textarea" readonly spellcheck="false"></textarea>
    `;
    container.appendChild(sec);
  });

  attachEvents();
}

/* ================== RENDER LIST PER PROGRAM ================== */
function renderListContent(progKey) {
  const listEl = document.getElementById(`list-${progKey}`);
  const subEl = document.getElementById(`prog-sub-${progKey}`);
  if (!listEl) return;

  const tanggal = document.getElementById('tanggal').value;
  const day = getToday();

  subEl.textContent = `📅 Jadwal hari ${day}, ${tanggalPanjang(tanggal)}`;

  if (!isValidDay(day)) {
    listEl.innerHTML = `<div class="no-jadwal">Tidak ada jadwal untuk hari ${day}.</div>`;
    return;
  }

  const rows = DATA.filter(r => r.prog === progKey);
  const items = [];
  rows.forEach(r => {
    const eff = getEffective(progKey, r, day);
    if (isKosong(eff.mapel)) return;
    items.push({ waktu: r.waktu, lokasi: r.lokasi, mapel: eff.mapel, tutor: eff.tutor });
  });
  items.sort((a, b) => parseTime(a.waktu) - parseTime(b.waktu));

  if (!items.length) {
    listEl.innerHTML = `<div class="no-jadwal">Tidak ada jadwal untuk program ini hari ${day}.</div>`;
    return;
  }

  listEl.innerHTML = items.map(it => `
    <div class="jadwal-item">
      <div class="jadwal-meta">
        <span class="jadwal-time">⏰ ${escHtml(formatWaktu(it.waktu))}</span>
        <span class="jadwal-loc">📍 ${escHtml(it.lokasi)}</span>
      </div>
      <div class="jadwal-pills">
        <button class="pill pill-mapel" data-action="mapel" data-prog="${progKey}" data-waktu="${escAttr(it.waktu)}" title="Ganti materi">
          <span>🔰</span>
          <span>${escHtml(it.mapel)}</span>
          <span class="edit-ico">✏️</span>
        </button>
        ${it.tutor ? `
          <button class="pill pill-tutor" data-action="tutor" data-prog="${progKey}" data-waktu="${escAttr(it.waktu)}" title="Ganti tutor (sementara)">
            <span>${icon(it.tutor)}</span>
            <span>${escHtml(it.tutor)}</span>
            <span class="edit-ico">✏️</span>
          </button>
        ` : `
          <button class="pill pill-tutor pill-empty" data-action="tutor" data-prog="${progKey}" data-waktu="${escAttr(it.waktu)}" title="Pilih tutor">
            <span>👤</span>
            <span>Pilih Tutor</span>
            <span class="edit-ico">+</span>
          </button>
        `}
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const { action, prog, waktu } = btn.dataset;
      openModal(action, prog, waktu);
    });
  });
}

function renderAllPrograms() {
  PROGRAMS.forEach(p => renderListContent(p.key));
}

/* ================== BUILD MESSAGE ================== */
function buildMessageFor(progKey) {
  const prog = PROGRAMS.find(p => p.key === progKey);
  const tanggal = document.getElementById('tanggal').value;
  const day = getToday();

  const lines = [];
  lines.push(SAPAAN);
  lines.push('');
  lines.push(`di Informasikan bahwa hari ini *Diklat ${prog.name}* akan di mulai pada ;`);
  lines.push('');
  lines.push(`📅 : ${day}, ${tanggalPanjang(tanggal)}`);

  if (!isValidDay(day)) {
    lines.push('');
    lines.push(`(Tidak ada jadwal pada hari ${day})`);
  } else {
    const rows = DATA.filter(r => r.prog === progKey);
    const items = [];
    rows.forEach(r => {
      const eff = getEffective(progKey, r, day);
      if (isKosong(eff.mapel)) return;
      items.push({ waktu: r.waktu, lokasi: r.lokasi, mapel: eff.mapel, tutor: eff.tutor });
    });
    items.sort((a, b) => parseTime(a.waktu) - parseTime(b.waktu));

    if (!items.length) {
      lines.push('');
      lines.push('(Tidak ada jadwal pada hari ini)');
    } else {
      items.forEach(s => {
        lines.push('');
        lines.push(`        ⏰ : ${formatWaktu(s.waktu)}`);
        lines.push(`        📍 : ${s.lokasi}`);
        lines.push(`        🔰 : ${s.mapel}`);
        if (s.tutor) lines.push(`        ${icon(s.tutor)} : ${s.tutor}`);
      });
    }
  }

  lines.push('');
  lines.push(PENUTUP);

  document.getElementById('hasil-' + progKey).value = lines.join('\n');
}

function buildAllMessages() {
  PROGRAMS.forEach(p => buildMessageFor(p.key));
}

function renderAll() {
  renderFullSchedule();
  renderAllPrograms();
  buildAllMessages();
}

/* ================== DAY BADGE ================== */
function updateDayBadge() {
  const day = getToday();
  document.getElementById('day-label').textContent = day;
}

/* ================== MODAL ================== */
let modalState = { type: null, progKey: null, waktu: null };

function openModal(type, progKey, waktu) {
  modalState = { type, progKey, waktu };
  renderModalContent();
  document.getElementById('modal').classList.add('active');
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  modalState = { type: null, progKey: null, waktu: null };
}

function renderModalContent() {
  const { type, progKey, waktu } = modalState;
  const prog = PROGRAMS.find(p => p.key === progKey);
  const titleEl = document.getElementById('modal-title');
  const subEl = document.getElementById('modal-sub');
  const tagEl = document.getElementById('modal-kelas-tag');
  const list = document.getElementById('modal-list');
  const customWrap = document.getElementById('custom-tutor-wrap');

  tagEl.textContent = prog ? prog.name : '—';
  list.innerHTML = '';

  if (type === 'tutor') {
    titleEl.textContent = '👩‍🏫 Pilih Tutor';
    subEl.textContent = 'Pilih tutor pengganti untuk jam ini (sementara). Atau ketik nama baru di bawah.';
    customWrap.style.display = 'flex';
    document.getElementById('custom-tutor-input').value = '';

    const currentTutor = getCurrentTutor(progKey, waktu);

    /* Opsi kosong */
    const emptyBtn = document.createElement('button');
    emptyBtn.className = 'tutor-item' + (currentTutor === '' ? ' selected' : '');
    emptyBtn.innerHTML = `<span class="tutor-icon">—</span><span class="tutor-name">Kosong</span><span class="tutor-sub">tanpa tutor</span>`;
    emptyBtn.onclick = () => pickTutor('');
    list.appendChild(emptyBtn);

    getTutorsForProgram(progKey).forEach(t => {
      const isF = isFemale(t);
      const btn = document.createElement('button');
      btn.className = 'tutor-item' + (currentTutor === t ? ' selected' : '');
      btn.innerHTML = `<span class="tutor-icon">${isF ? '👩‍🏫' : '👨‍🏫'}</span><span class="tutor-name">${escHtml(t)}</span>`;
      btn.onclick = () => pickTutor(t);
      list.appendChild(btn);
    });
  } else {
    titleEl.textContent = '🔰 Pilih Materi';
    subEl.textContent = 'Ganti materi untuk jam ini. Tutor default mapel baru akan dipakai.';
    customWrap.style.display = 'none';

    const currentMapel = getCurrentMapel(progKey, waktu);

    const emptyBtn = document.createElement('button');
    emptyBtn.className = 'tutor-item' + (currentMapel === '' ? ' selected' : '');
    emptyBtn.innerHTML = `<span class="tutor-icon">—</span><span class="tutor-name">Kosong</span><span class="tutor-sub">hapus</span>`;
    emptyBtn.onclick = () => pickMapel('');
    list.appendChild(emptyBtn);

    getMapelForProgram(progKey).forEach(m => {
      const defTutor = (TUTOR_BY_MAPEL[progKey] || {})[m] || '';
      const btn = document.createElement('button');
      btn.className = 'tutor-item' + (currentMapel === m ? ' selected' : '');
      btn.innerHTML =
        `<span class="tutor-icon">🔰</span>` +
        `<span class="tutor-name">${escHtml(m)}</span>` +
        `<span class="tutor-sub">${defTutor ? escHtml(defTutor) : '—'}</span>`;
      btn.onclick = () => pickMapel(m);
      list.appendChild(btn);
    });
  }
}

function getCurrentMapel(progKey, waktu) {
  const row = getRow(progKey, waktu);
  if (!row) return '';
  const day = getToday();
  if (!isValidDay(day)) return '';
  const ov = (sessionOverrides[progKey] && sessionOverrides[progKey][waktu]) || {};
  if ('mapel' in ov) return ov.mapel;
  return (row.hari[day] || '').trim();
}

function getCurrentTutor(progKey, waktu) {
  const day = getToday();
  if (!isValidDay(day)) return '';
  const mapel = getCurrentMapel(progKey, waktu);
  const ov = (sessionOverrides[progKey] && sessionOverrides[progKey][waktu]) || {};
  if ('tutor' in ov) return ov.tutor;
  return mapel ? ((TUTOR_BY_MAPEL[progKey] || {})[mapel] || '') : '';
}

function pickTutor(name) {
  const { progKey, waktu } = modalState;
  if (!sessionOverrides[progKey]) sessionOverrides[progKey] = {};
  if (!sessionOverrides[progKey][waktu]) sessionOverrides[progKey][waktu] = {};
  sessionOverrides[progKey][waktu].tutor = name;
  closeModal();
  renderAll();
}

function pickMapel(name) {
  const { progKey, waktu } = modalState;
  if (!sessionOverrides[progKey]) sessionOverrides[progKey] = {};
  if (!sessionOverrides[progKey][waktu]) sessionOverrides[progKey][waktu] = {};
  sessionOverrides[progKey][waktu].mapel = name;
  delete sessionOverrides[progKey][waktu].tutor;
  closeModal();
  renderAll();
}

function addCustomTutor() {
  const input = document.getElementById('custom-tutor-input');
  const name = input.value.trim();
  if (!name) return;
  const progKey = modalState.progKey;

  /* Simpan ke custom list kalau belum ada (di default maupun custom) */
  const all = getTutorsForProgram(progKey).map(t => t.toLowerCase());
  if (!all.includes(name.toLowerCase())) {
    customTutors[progKey].push(name);
  }

  /* Langsung pilih tutor ini */
  pickTutor(name);
}

document.getElementById('custom-tutor-add').addEventListener('click', addCustomTutor);
document.getElementById('custom-tutor-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addCustomTutor(); }
});

/* ================== RESET ================== */
function resetProgram(progKey) {
  sessionOverrides[progKey] = {};
  renderAll();
}
function resetAll() {
  sessionOverrides = {};
  customTutors = { regoff: [], regon: [], dsmb: [], mahasantri: [] };
  renderAll();
}

/* ================== EVENTS ================== */
function attachEvents() {
  document.querySelectorAll('.eye-btn[data-eye]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.eye;
      const wrap = document.getElementById('collapse-' + key);
      if (!wrap) return;
      const isCollapsed = wrap.classList.toggle('collapsed');
      btn.classList.toggle('on', !isCollapsed);
    });
  });

  document.querySelectorAll('.reset-btn[data-reset]').forEach(btn => {
    btn.addEventListener('click', () => resetProgram(btn.dataset.reset));
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async function () {
      const key = this.dataset.copy;
      const ta = document.getElementById('hasil-' + key);
      try {
        await navigator.clipboard.writeText(ta.value);
      } catch (err) {
        ta.removeAttribute('readonly');
        ta.select();
        document.execCommand('copy');
        ta.setAttribute('readonly', 'readonly');
      }
      const spans = btn.querySelectorAll('span');
      const oldIcon = spans[0].textContent;
      const oldText = spans[1].textContent;
      btn.classList.add('ok');
      spans[0].textContent = '✅';
      spans[1].textContent = 'Tersalin!';
      setTimeout(() => {
        spans[0].textContent = oldIcon;
        spans[1].textContent = oldText;
        btn.classList.remove('ok');
      }, 1600);
    });
  });

  document.querySelectorAll('.wa-btn[data-wa]').forEach(btn => {
    btn.addEventListener('click', function () {
      const key = this.dataset.wa;
      const text = document.getElementById('hasil-' + key).value || '';
      const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    });
  });
}

/* Modal events */
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('active')) {
    closeModal();
  }
});

/* Date change */
document.getElementById('tanggal').addEventListener('change', () => {
  sessionOverrides = {}; // reset karena hari berganti
  updateDayBadge();
  renderAll();
});

/* Reset all */
document.getElementById('reset-all-btn').addEventListener('click', resetAll);

/* ================== INIT ================== */
buildProgramSections();

(function setTodayDate() {
  const el = document.getElementById('tanggal');
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  el.value = `${yyyy}-${mm}-${dd}`;
})();

updateDayBadge();
renderAll();
</script>
